[package]
name = "wslvault-cli"
version = "0.1.0"
edition = "2021"
description = "Production-ready CLI for the WSLVault secrets management platform"
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "wslvault"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
colored = { workspace = true }
dialoguer = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
