{{/*
identity-service/deployment.yaml
The identity-service handles tenant authentication, JWT issuance, and token
validation. It is queried by the gateway before forwarding requests inward.
*/}}
{{- if .Values.identityService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wslvault.componentFullname" (dict "component" "identity-service" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.componentLabels" (dict "component" "identity-service" "componentType" "auth" "context" $) | nindent 4 }}
  {{- with .Values.identityService.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.identityService.replicaCount }}
  selector:
    matchLabels:
      {{- include "wslvault.componentSelectorLabels" (dict "component" "identity-service" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wslvault.componentLabels" (dict "component" "identity-service" "componentType" "auth" "context" $) | nindent 8 }}
      {{- if .Values.monitoring.enabled }}
      annotations:
        {{- toYaml .Values.monitoring.scrapeAnnotations | nindent 8 }}
        prometheus.io/port: {{ .Values.identityService.httpPort | quote }}
        {{- with .Values.identityService.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      {{- with .Values.identityService.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wslvault.serviceAccountName" . }}
      {{- include "wslvault.podSecurityContext" . | nindent 6 }}
      containers:
        - name: identity-service
          image: {{ include "wslvault.image" (dict "image" .Values.identityService.image "context" $) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "wslvault.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.identityService.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.identityService.grpcPort }}
              protocol: TCP
          env:
            - name: VAULT_HTTP_ADDR
              value: {{ printf "0.0.0.0:%v" .Values.identityService.httpPort | quote }}
            - name: VAULT_LISTEN_ADDR
              value: {{ printf "0.0.0.0:%v" .Values.identityService.grpcPort | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wslvault.dbCredentialsSecretName" . }}
                  key: {{ include "wslvault.dbPasswordSecretKey" . }}
                  optional: false
            - name: DATABASE_URL
              value: {{ printf "postgresql://%s:$(DB_PASSWORD)@%s:%s/%s"
                          .Values.postgresql.auth.username
                          (include "wslvault.postgresHost" .)
                          (include "wslvault.postgresPort" .)
                          .Values.postgresql.auth.database }}
            # Wraps each tenant's Ed25519 signing key, so private key material
            # sits under the root KEK and therefore under the seal.
            - name: CRYPTO_SERVICE_ENDPOINT
              value: "http://{{ include "wslvault.componentFullname" (dict "component" "crypto-service" "context" $) }}:50051"
            # Legacy shared secret. Only used for tokens issued before
            # per-tenant signing keys existed; remove once those have expired.
            - name: VAULT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "wslvault.jwtSecretName" . }}
                  key: {{ include "wslvault.jwtSecretKey" . }}
                  optional: false
            # Bootstrap credential for the API key management endpoints. Those
            # endpoints authenticate callers themselves — minting a key grants
            # whatever policies the request asks for, so they cannot rely on
            # the gateway-origin check alone, which a deployment that routes
            # around the gateway (or leaves VAULT_GATEWAY_SECRET unset) does
            # not apply. Optional: when the key is absent the service starts
            # with the bootstrap path disabled and accepts only JWTs carrying
            # the administrator policy.
            - name: VAULT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "wslvault.adminTokenSecretName" . }}
                  key: {{ include "wslvault.adminTokenSecretKey" . }}
                  optional: true
            {{- with .Values.identityService.adminPolicy }}
            # Policy a JWT must carry to manage API keys (default: "admin").
            - name: VAULT_ADMIN_POLICY
              value: {{ . | quote }}
            {{- end }}
            # gRPC address of the policy-engine for permission checks during token validation
            - name: POLICY_ENGINE_ADDR
              value: {{ printf "%s:%s"
                          (include "wslvault.componentFullname" (dict "component" "policy-engine" "context" $))
                          (.Values.policyEngine.grpcPort | toString) }}
            {{- with .Values.identityService.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.identityService.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- include "wslvault.podScheduling" (dict "service" .Values.identityService "context" $) | nindent 6 }}
{{- end }}
