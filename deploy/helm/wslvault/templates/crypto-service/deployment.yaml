{{/*
crypto-service/deployment.yaml
Deploys the crypto-service which provides AES-GCM and ChaCha20 encryption
primitives consumed by secret-engine, transit-engine, and lease-manager via gRPC.
*/}}
{{- if .Values.cryptoService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wslvault.componentFullname" (dict "component" "crypto-service" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.componentLabels" (dict "component" "crypto-service" "componentType" "core" "context" $) | nindent 4 }}
  {{- with .Values.cryptoService.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.cryptoService.replicaCount }}
  selector:
    matchLabels:
      {{- include "wslvault.componentSelectorLabels" (dict "component" "crypto-service" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wslvault.componentLabels" (dict "component" "crypto-service" "componentType" "core" "context" $) | nindent 8 }}
      {{- if .Values.monitoring.enabled }}
      annotations:
        {{- toYaml .Values.monitoring.scrapeAnnotations | nindent 8 }}
        prometheus.io/port: {{ .Values.cryptoService.httpPort | quote }}
        {{- with .Values.cryptoService.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      {{- with .Values.cryptoService.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wslvault.serviceAccountName" . }}
      {{- include "wslvault.podSecurityContext" . | nindent 6 }}
      containers:
        - name: crypto-service
          image: {{ include "wslvault.image" (dict "image" .Values.cryptoService.image "context" $) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "wslvault.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.cryptoService.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.cryptoService.grpcPort }}
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: {{ .Values.cryptoService.httpPort | quote }}
            - name: GRPC_PORT
              value: {{ .Values.cryptoService.grpcPort | quote }}
            # Read from the credentials Secret and interpolated at container
            # start, the same as every other service. It used to be built by
            # wslvault.databaseURL, which inlined postgresql.auth.password —
            # so with auth.existingSecret set (no plain-text password in
            # values) this silently became the literal default "changeme" and
            # the service crash-looped on authentication.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wslvault.dbCredentialsSecretName" . }}
                  key: {{ include "wslvault.dbPasswordSecretKey" . }}
                  optional: false
            - name: DATABASE_URL
              value: {{ printf "postgresql://%s:$(DB_PASSWORD)@%s:%s/%s"
                          .Values.postgresql.auth.username
                          (include "wslvault.postgresHost" .)
                          (include "wslvault.postgresPort" .)
                          .Values.postgresql.auth.database }}
            - name: VAULT_ROOT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "wslvault.rootKeySecretName" . }}
                  key: {{ include "wslvault.rootKeySecretKey" . }}
                  optional: false
            {{- with .Values.cryptoService.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.cryptoService.resources | nindent 12 }}
          # tmpfs mount required because readOnlyRootFilesystem=true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- include "wslvault.podScheduling" (dict "service" .Values.cryptoService "context" $) | nindent 6 }}
{{- end }}
