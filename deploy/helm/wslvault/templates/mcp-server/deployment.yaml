{{/*
mcp-server/deployment.yaml
The mcp-server implements the Model Context Protocol (MCP) to expose wslvault
secret retrieval capabilities to LLM toolchains. It runs as a single replica
because MCP sessions are stateful; scale carefully if session affinity is
handled upstream.
*/}}
{{- if .Values.mcpServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wslvault.componentFullname" (dict "component" "mcp-server" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.componentLabels" (dict "component" "mcp-server" "componentType" "integration" "context" $) | nindent 4 }}
  {{- with .Values.mcpServer.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.mcpServer.replicaCount }}
  selector:
    matchLabels:
      {{- include "wslvault.componentSelectorLabels" (dict "component" "mcp-server" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wslvault.componentLabels" (dict "component" "mcp-server" "componentType" "integration" "context" $) | nindent 8 }}
      {{- if .Values.monitoring.enabled }}
      annotations:
        {{- toYaml .Values.monitoring.scrapeAnnotations | nindent 8 }}
        prometheus.io/port: {{ .Values.mcpServer.httpPort | quote }}
        {{- with .Values.mcpServer.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      {{- with .Values.mcpServer.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wslvault.serviceAccountName" . }}
      {{- include "wslvault.podSecurityContext" . | nindent 6 }}
      containers:
        - name: mcp-server
          image: {{ include "wslvault.image" (dict "image" .Values.mcpServer.image "context" $) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "wslvault.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.mcpServer.httpPort }}
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: {{ .Values.mcpServer.httpPort | quote }}
            # gRPC address of the secret-engine used for MCP secret retrieval tools
            - name: SECRET_ENGINE_ADDR
              value: {{ printf "%s:%s"
                          (include "wslvault.componentFullname" (dict "component" "secret-engine" "context" $))
                          (.Values.secretEngine.grpcPort | toString) }}
            # gRPC address of the identity-service for MCP session authentication
            - name: IDENTITY_SERVICE_ADDR
              value: {{ printf "%s:%s"
                          (include "wslvault.componentFullname" (dict "component" "identity-service" "context" $))
                          (.Values.identityService.grpcPort | toString) }}
            {{- with .Values.mcpServer.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mcpServer.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.mcpServer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcpServer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcpServer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
