{{- if .Values.mcpServer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wslvault.componentFullname" (dict "component" "mcp-server" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.componentLabels" (dict "component" "mcp-server" "componentType" "integration" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "wslvault.componentSelectorLabels" (dict "component" "mcp-server" "context" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.mcpServer.httpPort }}
      targetPort: http
      protocol: TCP
{{- end }}
