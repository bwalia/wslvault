{{/*
serviceaccount.yaml - Shared Kubernetes ServiceAccount for all wslvault pods.

A single ServiceAccount is used across all microservices. If you require
per-service identities (e.g. for IRSA/Workload Identity), create individual
ServiceAccount resources inside each service subdirectory and disable this one.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wslvault.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
