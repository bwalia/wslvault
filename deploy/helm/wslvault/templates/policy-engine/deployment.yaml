{{/*
policy-engine/deployment.yaml
The policy-engine evaluates RBAC policies for secret-engine, transit-engine,
and gateway access-control decisions. It maintains its own policy store in
PostgreSQL.
*/}}
{{- if .Values.policyEngine.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wslvault.componentFullname" (dict "component" "policy-engine" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.componentLabels" (dict "component" "policy-engine" "componentType" "core" "context" $) | nindent 4 }}
  {{- with .Values.policyEngine.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.policyEngine.replicaCount }}
  selector:
    matchLabels:
      {{- include "wslvault.componentSelectorLabels" (dict "component" "policy-engine" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wslvault.componentLabels" (dict "component" "policy-engine" "componentType" "core" "context" $) | nindent 8 }}
      {{- if .Values.monitoring.enabled }}
      annotations:
        {{- toYaml .Values.monitoring.scrapeAnnotations | nindent 8 }}
        prometheus.io/port: {{ .Values.policyEngine.httpPort | quote }}
        {{- with .Values.policyEngine.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      {{- with .Values.policyEngine.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wslvault.serviceAccountName" . }}
      {{- include "wslvault.podSecurityContext" . | nindent 6 }}
      containers:
        - name: policy-engine
          image: {{ include "wslvault.image" (dict "image" .Values.policyEngine.image "context" $) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "wslvault.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.policyEngine.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.policyEngine.grpcPort }}
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: {{ .Values.policyEngine.httpPort | quote }}
            - name: GRPC_PORT
              value: {{ .Values.policyEngine.grpcPort | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wslvault.dbCredentialsSecretName" . }}
                  key: {{ include "wslvault.dbAppPasswordSecretKey" . }}
                  optional: false
            # Public keys for verifying per-tenant Ed25519 tokens. Verification
            # only — holding these confers no ability to mint a token, which is
            # the whole point of moving off the shared HS256 secret.
            - name: VAULT_JWKS_URL
              value: "http://{{ include "wslvault.componentFullname" (dict "component" "identity-service" "context" $) }}:8082/v1/identity/.well-known/jwks.json"
            - name: DATABASE_URL
              value: {{ printf "postgresql://%s:$(DB_PASSWORD)@%s:%s/%s"
                          (include "wslvault.dbAppUser" .)
                          (include "wslvault.postgresHost" .)
                          (include "wslvault.postgresPort" .)
                          .Values.postgresql.auth.database }}
            {{- with .Values.policyEngine.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.policyEngine.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- include "wslvault.podScheduling" (dict "service" .Values.policyEngine "context" $) | nindent 6 }}
{{- end }}
