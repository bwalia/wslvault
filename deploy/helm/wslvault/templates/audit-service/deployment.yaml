{{/*
audit-service/deployment.yaml
The audit-service provides an append-only audit log. Every mutating action
across the platform emits an event to the audit-service. The service persists
events to PostgreSQL with a write-once constraint enforced at the application
layer.
*/}}
{{- if .Values.auditService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wslvault.componentFullname" (dict "component" "audit-service" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.componentLabels" (dict "component" "audit-service" "componentType" "core" "context" $) | nindent 4 }}
  {{- with .Values.auditService.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.auditService.replicaCount }}
  selector:
    matchLabels:
      {{- include "wslvault.componentSelectorLabels" (dict "component" "audit-service" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wslvault.componentLabels" (dict "component" "audit-service" "componentType" "core" "context" $) | nindent 8 }}
      {{- if .Values.monitoring.enabled }}
      annotations:
        {{- toYaml .Values.monitoring.scrapeAnnotations | nindent 8 }}
        prometheus.io/port: {{ .Values.auditService.httpPort | quote }}
        {{- with .Values.auditService.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      {{- with .Values.auditService.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wslvault.serviceAccountName" . }}
      {{- include "wslvault.podSecurityContext" . | nindent 6 }}
      containers:
        - name: audit-service
          image: {{ include "wslvault.image" (dict "image" .Values.auditService.image "context" $) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "wslvault.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.auditService.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.auditService.grpcPort }}
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: {{ .Values.auditService.httpPort | quote }}
            - name: GRPC_PORT
              value: {{ .Values.auditService.grpcPort | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wslvault.dbCredentialsSecretName" . }}
                  key: {{ include "wslvault.dbPasswordSecretKey" . }}
                  optional: false
            - name: DATABASE_URL
              value: {{ printf "postgresql://%s:$(DB_PASSWORD)@%s:%s/%s"
                          .Values.postgresql.auth.username
                          (include "wslvault.postgresHost" .)
                          (include "wslvault.postgresPort" .)
                          .Values.postgresql.auth.database }}
            {{- with .Values.auditService.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.auditService.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.auditService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.auditService.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.auditService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
