{{- if .Values.leaseManager.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wslvault.componentFullname" (dict "component" "lease-manager" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.componentLabels" (dict "component" "lease-manager" "componentType" "core" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "wslvault.componentSelectorLabels" (dict "component" "lease-manager" "context" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.leaseManager.httpPort }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.leaseManager.grpcPort }}
      targetPort: grpc
      protocol: TCP
{{- end }}
