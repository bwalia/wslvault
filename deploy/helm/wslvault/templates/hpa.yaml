{{/*
hpa.yaml - HorizontalPodAutoscaler resources for wslvault services.

Each service gets its own HPA when <service>.autoscaling.enabled=true.
Default target: 70% CPU utilisation.  minReplicas defaults to the service's
static replicaCount value; maxReplicas defaults to 10.

Enable HPAs with:
  cryptoService:
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 12
      targetCPUUtilizationPercentage: 70
*/}}

{{- if and .Values.cryptoService.enabled .Values.cryptoService.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "wslvault.componentFullname" (dict "component" "crypto-service" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.componentLabels" (dict "component" "crypto-service" "componentType" "core" "context" $) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "wslvault.componentFullname" (dict "component" "crypto-service" "context" $) }}
  minReplicas: {{ .Values.cryptoService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.cryptoService.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.cryptoService.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

