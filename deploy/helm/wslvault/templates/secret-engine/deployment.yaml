{{/*
secret-engine/deployment.yaml
The secret-engine is the primary storage and retrieval layer. It calls
crypto-service for all encryption operations and exposes its gRPC interface
to the gateway and mcp-server.
*/}}
{{- if .Values.secretEngine.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wslvault.componentFullname" (dict "component" "secret-engine" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.componentLabels" (dict "component" "secret-engine" "componentType" "core" "context" $) | nindent 4 }}
  {{- with .Values.secretEngine.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.secretEngine.replicaCount }}
  selector:
    matchLabels:
      {{- include "wslvault.componentSelectorLabels" (dict "component" "secret-engine" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wslvault.componentLabels" (dict "component" "secret-engine" "componentType" "core" "context" $) | nindent 8 }}
      {{- if .Values.monitoring.enabled }}
      annotations:
        {{- toYaml .Values.monitoring.scrapeAnnotations | nindent 8 }}
        prometheus.io/port: {{ .Values.secretEngine.httpPort | quote }}
        {{- with .Values.secretEngine.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      {{- with .Values.secretEngine.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wslvault.serviceAccountName" . }}
      {{- include "wslvault.podSecurityContext" . | nindent 6 }}
      containers:
        - name: secret-engine
          image: {{ include "wslvault.image" (dict "image" .Values.secretEngine.image "context" $) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "wslvault.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.secretEngine.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.secretEngine.grpcPort }}
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: {{ .Values.secretEngine.httpPort | quote }}
            - name: GRPC_PORT
              value: {{ .Values.secretEngine.grpcPort | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wslvault.dbCredentialsSecretName" . }}
                  key: {{ include "wslvault.dbPasswordSecretKey" . }}
                  optional: false
            - name: DATABASE_URL
              value: {{ printf "postgresql://%s:$(DB_PASSWORD)@%s:%s/%s"
                          .Values.postgresql.auth.username
                          (include "wslvault.postgresHost" .)
                          (include "wslvault.postgresPort" .)
                          .Values.postgresql.auth.database }}
            # gRPC endpoints of the services the secret-engine depends on.
            # NOTE: the binary reads the *_ENDPOINT names below (see
            # services/secret-engine/src/main.rs) and requires the http:// scheme
            # for tonic. Earlier *_ADDR names (no scheme) were silently ignored,
            # so the engine fell back to unresolvable defaults (policy-engine:50053).
            - name: CRYPTO_SERVICE_ENDPOINT
              value: {{ printf "http://%s:%s"
                          (include "wslvault.componentFullname" (dict "component" "crypto-service" "context" $))
                          (.Values.cryptoService.grpcPort | toString) }}
            - name: POLICY_ENGINE_ENDPOINT
              value: {{ printf "http://%s:%s"
                          (include "wslvault.componentFullname" (dict "component" "policy-engine" "context" $))
                          (.Values.policyEngine.grpcPort | toString) }}
            - name: AUDIT_SERVICE_ENDPOINT
              value: {{ printf "http://%s:%s"
                          (include "wslvault.componentFullname" (dict "component" "audit-service" "context" $))
                          (.Values.auditService.grpcPort | toString) }}
            - name: LEASE_MANAGER_ENDPOINT
              value: {{ printf "http://%s:%s"
                          (include "wslvault.componentFullname" (dict "component" "lease-manager" "context" $))
                          (.Values.leaseManager.grpcPort | toString) }}
            {{- with .Values.secretEngine.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.secretEngine.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.secretEngine.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.secretEngine.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.secretEngine.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
