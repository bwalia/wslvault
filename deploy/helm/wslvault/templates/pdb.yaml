{{/*
pdb.yaml - PodDisruptionBudgets for wslvault core services.

A PDB is created for each service that has 2 or more replicas, ensuring
at least 1 pod remains available during voluntary disruptions (e.g. node
drains, cluster upgrades).

Services with replicaCount=1 (mcp-server by default) are excluded because
setting minAvailable=1 on a single-replica deployment would block node drains.
Operators should scale mcp-server to 2+ replicas before enabling a PDB for it.
*/}}

{{- if and .Values.cryptoService.enabled (gt (int .Values.cryptoService.replicaCount) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "wslvault.componentFullname" (dict "component" "crypto-service" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.componentLabels" (dict "component" "crypto-service" "componentType" "core" "context" $) | nindent 4 }}
spec:
  # Keep at least 1 crypto-service pod running during voluntary disruptions
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "wslvault.componentSelectorLabels" (dict "component" "crypto-service" "context" $) | nindent 6 }}
{{- end }}

