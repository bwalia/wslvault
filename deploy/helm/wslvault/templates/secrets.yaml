{{/*
secrets.yaml - Kubernetes Secret resources for wslvault.

Three secrets are managed here:
  1. wslvault-db-credentials  - PostgreSQL username/password used by all services
     (skipped when postgresql.auth.existingSecret is set)
  2. <fullname>-root-key      - Root encryption key for the crypto-service
  3. <fullname>-jwt-secret    - JWT signing key for the identity-service

Security note: In production, populate these values via an external secret
manager (e.g. HashiCorp Vault, AWS Secrets Manager) and reference them
through an ExternalSecret or CSI driver rather than committing values here.
*/}}

{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wslvault.fullname" . }}-db-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.labels" . | nindent 4 }}
  annotations:
    # Prevent Helm from rendering the secret value in plain text in the release manifest
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Base64-encoded PostgreSQL username
  username: {{ .Values.postgresql.auth.username | b64enc | quote }}
  # Base64-encoded PostgreSQL password
  # WARNING: replace with a strong value before deploying to production
  password: {{ .Values.postgresql.auth.password | b64enc | quote }}
{{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wslvault.fullname" . }}-root-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.labels" . | nindent 4 }}
  annotations:
    # Retain this secret across Helm upgrades and uninstalls to prevent data loss
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.secrets.rootKey }}
  # Operator-supplied root key (must be a base64-encoded 32-byte AES-256 key)
  root-key: {{ .Values.secrets.rootKey | b64enc | quote }}
  {{- else }}
  # Placeholder — replace with a real key before deploying to production
  # Generate with: openssl rand -base64 32
  root-key: {{ "REPLACE_ME_WITH_A_REAL_KEY" | b64enc | quote }}
  {{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wslvault.fullname" . }}-jwt-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.secrets.jwtSecret }}
  # Operator-supplied JWT signing secret
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  {{- else }}
  # Placeholder — replace with a cryptographically random value before deploying
  # Generate with: openssl rand -base64 64
  jwt-secret: {{ "REPLACE_ME_WITH_A_REAL_JWT_SECRET" | b64enc | quote }}
  {{- end }}

{{- if .Values.pkiEngine.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wslvault.fullname" . }}-pki-root-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.labels" . | nindent 4 }}
  annotations:
    # Retain across upgrades/uninstalls: losing this key makes CA private keys unrecoverable
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.secrets.pkiRootKey }}
  # Operator-supplied PKI root key (must be a base64-encoded 32-byte AES-256 key)
  pki-root-key: {{ .Values.secrets.pkiRootKey | b64enc | quote }}
  {{- else }}
  # Placeholder — replace with a real key before deploying to production
  # Generate with: openssl rand -base64 32
  pki-root-key: {{ "REPLACE_ME_WITH_A_REAL_PKI_KEY" | b64enc | quote }}
  {{- end }}
{{- end }}
