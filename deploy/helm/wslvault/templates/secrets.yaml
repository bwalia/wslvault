{{/*
secrets.yaml - Kubernetes Secret resources for wslvault.

Three secrets are managed here:
  1. wslvault-db-credentials  - PostgreSQL username/password used by all services
     (skipped when postgresql.auth.existingSecret is set)
  2. <fullname>-root-key      - Root encryption key for the crypto-service
  3. <fullname>-jwt-secret    - JWT signing key for the identity-service
  4. <fullname>-admin-token   - Bootstrap admin token for API key management
     (only when secrets.adminToken is set)

Security note: none of these keys have a default. The chart FAILS TO RENDER
rather than emit a placeholder, because a placeholder that is committed to a
public repository is a working key that every installation shares. Supply real
values, or set secrets.existingSecret to reference material provisioned by an
external secret manager (ExternalSecret, CSI driver, SOPS).
*/}}

{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wslvault.fullname" . }}-db-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.labels" . | nindent 4 }}
  annotations:
    # Prevent Helm from rendering the secret value in plain text in the release manifest
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Base64-encoded PostgreSQL username
  username: {{ .Values.postgresql.auth.username | b64enc | quote }}
  # Base64-encoded PostgreSQL password
  # WARNING: replace with a strong value before deploying to production
  password: {{ .Values.postgresql.auth.password | b64enc | quote }}
{{- end }}

{{/*
The three shared-key Secrets below are skipped entirely when
secrets.existingSecret points at externally provisioned material. In a
multi-region mesh that is the only correct setup: the root key, JWT secret and
PKI root key must be byte-identical in every region, and chart-generated
placeholders per region would silently break cross-region decryption.
*/}}
{{- if not .Values.secrets.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wslvault.fullname" . }}-root-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.labels" . | nindent 4 }}
  annotations:
    # Retain this secret across Helm upgrades and uninstalls to prevent data loss
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if not .Values.secrets.rootKey }}
  {{- fail "secrets.rootKey is required. Generate one with: openssl rand -base64 32 — or set secrets.existingSecret to reference externally provisioned material. A chart-rendered placeholder would key every install identically." }}
  {{- end }}
  # Operator-supplied root key (must be a base64-encoded 32-byte AES-256 key)
  root-key: {{ .Values.secrets.rootKey | b64enc | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wslvault.fullname" . }}-jwt-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if not .Values.secrets.jwtSecret }}
  {{- fail "secrets.jwtSecret is required. Generate one with: openssl rand -base64 64 — or set secrets.existingSecret. The former placeholder was 33 bytes, which cleared identity-service's 32-byte minimum, so every default install signed its tokens with a value published in this repository and anyone could forge a token for any tenant." }}
  {{- end }}
  # Operator-supplied JWT signing secret
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}

{{- if .Values.auditService.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wslvault.fullname" . }}-audit-signing-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.labels" . | nindent 4 }}
  annotations:
    # Retain across upgrades/uninstalls: records signed with a lost key can
    # never be re-verified.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if not .Values.secrets.auditSigningKey }}
  {{- fail "secrets.auditSigningKey is required when auditService.enabled — generate with: openssl rand -base64 48 (at least 32 bytes). audit-service refuses to start without it rather than write records that look signed and are not." }}
  {{- end }}
  # Master key for the per-tenant audit signing chain
  audit-signing-key: {{ .Values.secrets.auditSigningKey | b64enc | quote }}
{{- end }}

{{- if .Values.secrets.adminToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wslvault.fullname" . }}-admin-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Bootstrap administrator token for the API key management endpoints.
  # Only rendered when an operator supplies one: unlike the keys above there is
  # no safe placeholder, because a well-known default would be worse than
  # leaving the bootstrap path switched off.
  admin-token: {{ .Values.secrets.adminToken | b64enc | quote }}
{{- end }}

{{- if .Values.pkiEngine.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wslvault.fullname" . }}-pki-root-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.labels" . | nindent 4 }}
  annotations:
    # Retain across upgrades/uninstalls: losing this key makes CA private keys unrecoverable
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if not .Values.secrets.pkiRootKey }}
  {{- fail "secrets.pkiRootKey is required when pkiEngine.enabled — generate with: openssl rand -base64 32. Losing or sharing this key makes every CA private key recoverable." }}
  {{- end }}
  # Operator-supplied PKI root key (must be a base64-encoded 32-byte AES-256 key)
  pki-root-key: {{ .Values.secrets.pkiRootKey | b64enc | quote }}
{{- end }}
{{- end }}{{/* not secrets.existingSecret */}}
