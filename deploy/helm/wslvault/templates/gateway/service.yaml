{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wslvault.componentFullname" (dict "component" "gateway" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.componentLabels" (dict "component" "gateway" "componentType" "edge" "context" $) | nindent 4 }}
  {{- with .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- include "wslvault.componentSelectorLabels" (dict "component" "gateway" "context" $) | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.gateway.httpsPort }}
      targetPort: https
      protocol: TCP
{{- end }}
