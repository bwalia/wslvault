{{/*
pki-engine/deployment.yaml
The pki-engine is an internal certificate authority: per-tenant CA
management, role-based certificate issuance, CSR signing, revocation,
and CRL distribution. CA private keys are envelope-encrypted at rest
with the PKI root key. Consumers interact via REST only.
*/}}
{{- if .Values.pkiEngine.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wslvault.componentFullname" (dict "component" "pki-engine" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wslvault.componentLabels" (dict "component" "pki-engine" "componentType" "core" "context" $) | nindent 4 }}
  {{- with .Values.pkiEngine.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.pkiEngine.replicaCount }}
  selector:
    matchLabels:
      {{- include "wslvault.componentSelectorLabels" (dict "component" "pki-engine" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wslvault.componentLabels" (dict "component" "pki-engine" "componentType" "core" "context" $) | nindent 8 }}
      {{- if .Values.monitoring.enabled }}
      annotations:
        {{- toYaml .Values.monitoring.scrapeAnnotations | nindent 8 }}
        prometheus.io/port: {{ .Values.pkiEngine.httpPort | quote }}
        {{- with .Values.pkiEngine.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      {{- with .Values.pkiEngine.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wslvault.serviceAccountName" . }}
      {{- include "wslvault.podSecurityContext" . | nindent 6 }}
      containers:
        - name: pki-engine
          image: {{ include "wslvault.image" (dict "image" .Values.pkiEngine.image "context" $) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "wslvault.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.pkiEngine.httpPort }}
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: {{ .Values.pkiEngine.httpPort | quote }}
            # Root KEK that envelope-encrypts tenant CA private keys at rest
            - name: PKI_ROOT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "wslvault.pkiRootKeySecretName" . }}
                  key: {{ include "wslvault.pkiRootKeySecretKey" . }}
                  optional: false
            {{- with .Values.pkiEngine.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.pkiEngine.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- include "wslvault.podScheduling" (dict "service" .Values.pkiEngine "context" $) | nindent 6 }}
{{- end }}
