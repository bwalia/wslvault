# -- Global configuration applied across all services
global:
  # -- Default image tag for all wslvault services (overridden per-service with image.tag)
  imageTag: "0.1.0"
  # -- Default image pull policy
  imagePullPolicy: IfNotPresent
  # -- Image pull secrets for private registries
  imagePullSecrets: []
  # -- Target namespace (used in NetworkPolicy cross-namespace selectors)
  namespace: wslvault

# -- Service account creation and RBAC configuration
serviceAccount:
  # -- Whether to create a shared service account
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Override the default service account name
  name: ""

# -- RBAC resource creation
rbac:
  # -- Whether to create RBAC roles and bindings
  create: true

# -- NetworkPolicy creation
networkPolicies:
  # -- Whether to create NetworkPolicy resources (default deny + explicit allow rules)
  enabled: true

# -- Edge Ingress for the control plane (Traefik / k3s). Chart-managed
# equivalent of deploy/k8s/wslvault-ingress.yaml — enable exactly ONE of the two
# (this template OR the raw manifest) to avoid duplicate Ingress objects.
# The route map is verified against the actual axum route registrations in
# services/*/src; only prefixes a backend truly serves over HTTP are listed.
edgeIngress:
  enabled: false
  ingressClassName: traefik
  entrypoint: websecure
  host: vault.workstation.co.uk
  tls:
    # -- Self-signed by default; SANs must cover every host below. Point this at
    # a cert-manager-issued secret for a trusted chain.
    secretName: wslvault-gateway-tls
    hosts:
      - vault.workstation.co.uk
      - wslvault.workstation.co.uk
  # -- HTTP:80 -> HTTPS 308 redirect (Traefik redirectScheme middleware).
  httpRedirect:
    enabled: true
    entrypoint: web
  # -- path -> component:port. Verified 2026-07-13 against source routes.
  # Deliberately omitted (no HTTP backend): /v1/identity (unimplemented),
  # /v1/leases + /v1/audit (gRPC-only). /healthz + /readyz map to secret-engine.
  routes:
    - { path: /healthz, component: secret-engine, port: 8081 }
    - { path: /readyz, component: secret-engine, port: 8081 }
    - { path: /v1/auth, component: identity-service, port: 8082 }
    - { path: /v1/tenants, component: identity-service, port: 8082 }
    - { path: /v1/api-keys, component: identity-service, port: 8082 }
    - { path: /v1/quotas, component: identity-service, port: 8082 }
    - { path: /scim, component: identity-service, port: 8082 }
    - { path: /v1/secret, component: secret-engine, port: 8081 }
    - { path: /v1/transit, component: transit-engine, port: 8086 }
    - { path: /v1/policies, component: policy-engine, port: 8083 }
    - { path: /v1/pki, component: pki-engine, port: 8088 }
    - { path: /v1/mcp, component: mcp-server, port: 8087 }

# -- Prometheus monitoring annotations
monitoring:
  # -- Annotate pods with prometheus.io/scrape, path, and port
  enabled: true
  scrapeAnnotations:
    "prometheus.io/scrape": "true"
    "prometheus.io/path": "/metrics"

# -- Secrets injected as Kubernetes Secret objects
secrets:
  # -- Root encryption key for the vault (base64-encoded 32-byte key recommended)
  rootKey: ""
  # -- JWT signing secret for identity-service token issuance
  jwtSecret: ""
  # -- PKI root key that envelope-encrypts tenant CA private keys (base64-encoded 32-byte key)
  pkiRootKey: ""

# -- crypto-service: AES-GCM and ChaCha20 encryption primitives
cryptoService:
  enabled: true
  replicaCount: 3
  image:
    repository: bwalia/wslvault-crypto-service
    # -- Leave empty to use global.imageTag
    tag: ""
  # -- HTTP port for REST and health endpoints
  httpPort: 8080
  # -- gRPC port for inter-service calls
  grpcPort: 50051
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # -- Extra environment variables injected into the container
  extraEnv: []
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# -- secret-engine: core secret storage and retrieval engine
secretEngine:
  enabled: true
  replicaCount: 3
  image:
    repository: bwalia/wslvault-secret-engine
    tag: ""
  httpPort: 8081
  grpcPort: 50052
  resources:
    requests:
      cpu: "150m"
      memory: "256Mi"
    limits:
      cpu: "750m"
      memory: "512Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# -- policy-engine: RBAC policy evaluation and enforcement
policyEngine:
