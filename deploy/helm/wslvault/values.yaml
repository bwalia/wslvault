# -- audit-service: immutable audit log ingestion and query
auditService:
  enabled: true
  replicaCount: 2
  image:
    repository: bwalia/wslvault-audit-service
    tag: ""
  httpPort: 8085
  grpcPort: 50056
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []
  autoscaling:
    enabled: false
