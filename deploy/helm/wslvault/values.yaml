  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# -- identity-service: authentication, JWT issuance, and tenant management
identityService:
  enabled: true
  replicaCount: 2
  image:
    repository: wslvault/identity-service
    tag: ""
  httpPort: 8082
  grpcPort: 50054
  resources:
