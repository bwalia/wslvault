      memory: "256Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# -- pki-engine: internal certificate authority (per-tenant CAs, cert issuance, CRL)
pkiEngine:
  enabled: true
  replicaCount: 2
  image:
    repository: bwalia/wslvault-pki-engine
    tag: ""
  httpPort: 8088
  # -- pki-engine does not expose a gRPC port
  resources:
    requests:
      cpu: "150m"
      memory: "128Mi"
    limits:
      cpu: "750m"
      memory: "256Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []

# -- mcp-server: Model Context Protocol integration server (single replica by design)
mcpServer:
  enabled: true
  replicaCount: 1
  image:
    repository: bwalia/wslvault-mcp-server
    tag: ""
  httpPort: 8087
  # -- mcp-server does not expose a gRPC port
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# -- gateway: OpenResty TLS termination and reverse proxy
gateway:
  enabled: true
  replicaCount: 2
  image:
    repository: openresty/openresty
    tag: "1.25.3.2-alpine"
  httpsPort: 443
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []
  # -- TLS certificate secret name (must exist in the same namespace)
  tls:
    secretName: "wslvault-gateway-tls"
  service:
    type: LoadBalancer
    annotations: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# -- replication-agent: cross-region secret, policy, and tenant replication
replicationAgent:
  enabled: true
  replicaCount: 2
  image:
    repository: bwalia/wslvault-replication-agent
    # -- Leave empty to use global.imageTag
    tag: ""
  # -- HTTP port for replication API, health probes, and Prometheus metrics
  httpPort: 8091
  # -- Milliseconds between peer polls
  pollIntervalMs: 500
  # -- Maximum events to fetch per poll batch
  batchSize: 100
  # -- Conflict resolution strategy: "last_write_wins", "vector_clock", or "manual"
  conflictStrategy: "last_write_wins"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # -- Extra env vars (e.g. REPLICATION_PEERS for wiring peer URLs)
  extraEnv: []

# -- region-health: multi-region health monitor and failover coordinator
regionHealth:
  enabled: true
  replicaCount: 2
  image:
    repository: bwalia/wslvault-region-health
    tag: ""
  # -- HTTP port for health API and Prometheus metrics
  httpPort: 8092
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []

# -- sync-scheduler: scheduled sync with external secret managers
syncScheduler:
  enabled: true
  replicaCount: 2
  image:
    repository: bwalia/wslvault-sync-scheduler
    tag: ""
  # -- HTTP port for status API and health probes
  httpPort: 8093
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []

# -- Bitnami PostgreSQL subchart configuration
# See: https://github.com/bitnami/charts/tree/main/bitnami/postgresql
postgresql:
  # -- Deploy PostgreSQL as part of this release; set to false to use an external database
  enabled: true
  auth:
    # -- PostgreSQL database name
    database: wslvault
    # -- PostgreSQL superuser username
    username: wslvault
    # -- PostgreSQL password (set a strong value in production; prefer existingSecret)
    password: "changeme"
    # -- Use an existing secret for credentials instead of the above plain-text values
    existingSecret: ""
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
  # -- Used to build the DATABASE_URL for all services when postgresql.enabled=true
  # Override this if connecting to an external database
  external:
    host: ""
    port: 5432
