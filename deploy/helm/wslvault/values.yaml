# -- Global configuration applied across all services
global:
  # -- Default image tag for all wslvault services (overridden per-service with image.tag)
  imageTag: "0.1.0"
  # -- Default image pull policy
  imagePullPolicy: IfNotPresent
  # -- Image pull secrets for private registries
  imagePullSecrets: []
  # -- Target namespace (used in NetworkPolicy cross-namespace selectors)
  namespace: wslvault

# -- Service account creation and RBAC configuration
serviceAccount:
  # -- Whether to create a shared service account
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Override the default service account name
  name: ""

# -- RBAC resource creation
rbac:
  # -- Whether to create RBAC roles and bindings
  create: true

# -- NetworkPolicy creation
networkPolicies:
  # -- Whether to create NetworkPolicy resources (default deny + explicit allow rules)
  enabled: true

# -- Ingress configuration (disabled by default; use gateway TLS termination instead)
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: wslvault.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: wslvault-tls
      hosts:
        - wslvault.example.com

# -- Prometheus monitoring annotations
monitoring:
  # -- Annotate pods with prometheus.io/scrape, path, and port
  enabled: true
  scrapeAnnotations:
    "prometheus.io/scrape": "true"
    "prometheus.io/path": "/metrics"

# -- Secrets injected as Kubernetes Secret objects
secrets:
  # -- Root encryption key for the vault (base64-encoded 32-byte key recommended)
  rootKey: ""
  # -- JWT signing secret for identity-service token issuance
  jwtSecret: ""

# -- crypto-service: AES-GCM and ChaCha20 encryption primitives
cryptoService:
  enabled: true
  replicaCount: 3
  image:
    repository: wslvault/crypto-service
    # -- Leave empty to use global.imageTag
    tag: ""
  # -- HTTP port for REST and health endpoints
  httpPort: 8080
  # -- gRPC port for inter-service calls
  grpcPort: 50051
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # -- Extra environment variables injected into the container
  extraEnv: []
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# -- secret-engine: core secret storage and retrieval engine
secretEngine:
  enabled: true
  replicaCount: 3
  image:
    repository: wslvault/secret-engine
    tag: ""
  httpPort: 8081
  grpcPort: 50052
  resources:
    requests:
      cpu: "150m"
      memory: "256Mi"
    limits:
      cpu: "750m"
      memory: "512Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# -- policy-engine: RBAC policy evaluation and enforcement
policyEngine:
  enabled: true
  replicaCount: 2
  image:
    repository: wslvault/policy-engine
    tag: ""
  httpPort: 8083
  grpcPort: 50053
  resources:
