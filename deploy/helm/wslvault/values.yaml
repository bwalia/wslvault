    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# -- lease-manager: secret lease lifecycle and renewal
leaseManager:
  enabled: true
  replicaCount: 2
  image:
    repository: wslvault/lease-manager
    tag: ""
  httpPort: 8084
  grpcPort: 50055
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# -- audit-service: immutable audit log ingestion and query
auditService:
  enabled: true
  replicaCount: 2
  image:
    repository: wslvault/audit-service
    tag: ""
  httpPort: 8085
  grpcPort: 50056
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# -- transit-engine: encryption-as-a-service (no persistent secrets stored)
transitEngine:
  enabled: true
  replicaCount: 2
  image:
    repository: wslvault/transit-engine
    tag: ""
  httpPort: 8086
  # -- transit-engine does not expose a gRPC port
  resources:
    requests:
      cpu: "150m"
      memory: "128Mi"
    limits:
      cpu: "750m"
      memory: "256Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# -- mcp-server: Model Context Protocol integration server (single replica by design)
mcpServer:
  enabled: true
  replicaCount: 1
  image:
    repository: wslvault/mcp-server
    tag: ""
  httpPort: 8087
  # -- mcp-server does not expose a gRPC port
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# -- gateway: OpenResty TLS termination and reverse proxy
gateway:
  enabled: true
  replicaCount: 2
  image:
    repository: openresty/openresty
    tag: "1.25.3.2-alpine"
  httpsPort: 443
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []
  # -- TLS certificate secret name (must exist in the same namespace)
  tls:
    secretName: "wslvault-gateway-tls"
  service:
    type: LoadBalancer
    annotations: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# -- Bitnami PostgreSQL subchart configuration
# See: https://github.com/bitnami/charts/tree/main/bitnami/postgresql
postgresql:
  # -- Deploy PostgreSQL as part of this release; set to false to use an external database
  enabled: true
  auth:
    # -- PostgreSQL database name
    database: wslvault
    # -- PostgreSQL superuser username
    username: wslvault
    # -- PostgreSQL password (set a strong value in production; prefer existingSecret)
    password: "changeme"
    # -- Use an existing secret for credentials instead of the above plain-text values
    existingSecret: ""
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
  # -- Used to build the DATABASE_URL for all services when postgresql.enabled=true
  # Override this if connecting to an external database
  external:
    host: ""
    port: 5432
