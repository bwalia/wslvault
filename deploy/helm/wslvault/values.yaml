    targetCPUUtilizationPercentage: 70

# -- lease-manager: secret lease lifecycle and renewal
leaseManager:
  enabled: true
  replicaCount: 2
  image:
    repository: bwalia/wslvault-lease-manager
    tag: ""
  httpPort: 8084
  grpcPort: 50055
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
