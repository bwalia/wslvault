apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
    component: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        component: edge
    spec:
      containers:
        - name: gateway
          image: openresty/openresty:1.25.3.2-alpine
          ports:
            - name: https
              containerPort: 443
            - name: health
              containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /usr/local/openresty/nginx/conf/nginx.conf
              subPath: main.conf
            - name: lua-scripts
              mountPath: /etc/openresty/lua
            - name: tls-certs
              mountPath: /etc/ssl/certs
            - name: tls-key
              mountPath: /etc/ssl/private
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "1000m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: health
          readinessProbe:
            httpGet:
              path: /ready
              port: health
      volumes:
        - name: nginx-config
          configMap:
            name: gateway-config
        - name: lua-scripts
          configMap:
            name: gateway-lua
        - name: tls-certs
          secret:
            secretName: gateway-tls
        - name: tls-key
          secret:
            secretName: gateway-tls
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - name: https
      port: 443
      targetPort: https
