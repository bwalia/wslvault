apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-engine
  labels:
    app: policy-engine
    component: core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: policy-engine
  template:
    metadata:
      labels:
        app: policy-engine
        component: core
    spec:
      serviceAccountName: policy-engine
      containers:
        - name: policy-engine
          image: wslvault/policy-engine:latest
          ports:
            - name: http
              containerPort: 8083
            - name: grpc
              containerPort: 50053
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wslvault-db-credentials
                  key: url
            - name: RUST_LOG
              value: "info,policy_engine=debug"
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "2000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: policy-engine
spec:
  selector:
    app: policy-engine
  ports:
    - name: http
      port: 8083
      targetPort: http
    - name: grpc
      port: 50053
      targetPort: grpc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: policy-engine
