apiVersion: apps/v1
kind: Deployment
metadata:
  name: transit-engine
  labels:
    app: transit-engine
    component: core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transit-engine
  template:
    metadata:
      labels:
        app: transit-engine
        component: core
    spec:
      serviceAccountName: transit-engine
      containers:
        - name: transit-engine
          image: wslvault/transit-engine:latest
          ports:
            - name: http
              containerPort: 8086
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wslvault-db-credentials
                  key: url
            - name: POLICY_ENGINE_ENDPOINT
              value: "http://policy-engine:50053"
            - name: AUDIT_SERVICE_ENDPOINT
              value: "http://audit-service:50056"
            - name: RUST_LOG
              value: "info,transit_engine=debug"
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "4000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: transit-engine
spec:
  selector:
    app: transit-engine
  ports:
    - name: http
      port: 8086
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: transit-engine
