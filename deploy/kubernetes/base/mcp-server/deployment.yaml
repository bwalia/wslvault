apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels:
    app: mcp-server
    component: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
        component: core
    spec:
      serviceAccountName: mcp-server
      containers:
        - name: mcp-server
          image: wslvault/mcp-server:latest
          ports:
            - name: http
              containerPort: 8087
          env:
            - name: VAULT_SECRET_ENGINE_ADDR
              value: "http://secret-engine:8081"
            - name: VAULT_TRANSIT_ENGINE_ADDR
              value: "http://transit-engine:8086"
            - name: RUST_LOG
              value: "info,mcp_server=debug"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
spec:
  selector:
    app: mcp-server
  ports:
    - name: http
      port: 8087
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server
