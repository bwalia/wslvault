apiVersion: apps/v1
kind: Deployment
metadata:
  name: region-health
  labels:
    app: region-health
    component: replication
spec:
  # Two replicas; leader election ensures only one actively polls remote regions.
  replicas: 2
  selector:
    matchLabels:
      app: region-health
  template:
    metadata:
      labels:
        app: region-health
        component: replication
    spec:
      serviceAccountName: region-health
      containers:
        - name: region-health
          image: wslvault/region-health:latest
          ports:
            - name: http
              containerPort: 8092
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wslvault-db-credentials
                  key: url
            - name: REGION_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['topology.kubernetes.io/region']
            - name: REGION_HEALTH_LISTEN_ADDR
              value: "0.0.0.0:8092"
            - name: RUST_LOG
              value: "info,region_health=debug"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: region-health
spec:
  selector:
    app: region-health
  ports:
    - name: http
      port: 8092
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: region-health
