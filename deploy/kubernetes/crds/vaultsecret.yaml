---
# VaultSecret CRD for the wslvault Kubernetes Secrets Sync Operator.
#
# Install with:
#   kubectl apply -f deploy/kubernetes/crds/vaultsecret.yaml
#
# The operator will also attempt to self-install this CRD on startup if it
# has the necessary RBAC permissions.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vaultsecrets.wslvault.io
  labels:
    app.kubernetes.io/name: vaultsecret
    app.kubernetes.io/component: crd
    app.kubernetes.io/part-of: wslvault
    app.kubernetes.io/managed-by: k8s-operator.wslvault.io
spec:
  group: wslvault.io
  names:
    kind: VaultSecret
    listKind: VaultSecretList
    plural: vaultsecrets
    singular: vaultsecret
    shortNames:
      - vs
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Path
          type: string
          jsonPath: .spec.path
        - name: Synced
          type: string
          jsonPath: .status.conditions[0].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: |
            VaultSecret drives the wslvault Kubernetes Secrets Sync Operator.
            Each instance describes a single path in the wslvault secret-engine
            that should be materialised as a native Kubernetes Secret.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: Specification of the desired sync behaviour.
              required:
                - path
              properties:
                path:
                  type: string
                  description: |
                    Path in the wslvault secret engine (e.g. "myapp/database/credentials").
                    Passed verbatim to GET /v1/secrets/<path> on the secret-engine.
                  minLength: 1
                  example: "myapp/database/credentials"
                target:
                  type: object
                  description: Specification of the Kubernetes Secret to create or update.
                  properties:
                    name:
                      type: string
                      description: Name of the target Kubernetes Secret. Defaults to the VaultSecret name.
                    namespace:
                      type: string
                      description: Namespace for the target Secret. Defaults to the VaultSecret namespace.
                    secret_type:
                      type: string
                      description: Kubernetes Secret type field.
                      enum:
                        - Opaque
                        - "kubernetes.io/tls"
                        - "kubernetes.io/dockerconfigjson"
                      default: Opaque
                refresh_interval:
                  type: integer
                  format: int64
                  minimum: 10
                  description: |
                    Re-sync interval in seconds. Defaults to 60.
                    The minimum accepted value is 10 to prevent excessive load
                    on the secret-engine.
                  default: 60
                vault_endpoint:
                  type: string
                  description: |
                    Override for the wslvault secret-engine HTTP base URL.
                    When omitted the operator uses the VAULT_ENDPOINT environment variable
                    (default: http://secret-engine:8081).
                  example: "http://secret-engine:8081"
                auth:
                  type: object
                  description: Authentication configuration for reaching the secret-engine.
                  properties:
                    service_account_ref:
                      type: object
                      description: |
                        Reference to a Kubernetes ServiceAccount whose projected token is
                        used to authenticate with the secret-engine.
                      required:
                        - name
                      properties:
                        name:
                          type: string
                          description: Name of the service account.
                        namespace:
                          type: string
                          description: Namespace of the service account. Defaults to VaultSecret namespace.
                    token_secret_ref:
                      type: object
                      description: |
                        Reference to a Kubernetes Secret that holds a vault token.
                      required:
                        - name
                      properties:
                        name:
                          type: string
                          description: Name of the Kubernetes Secret holding the vault token.
                        key:
                          type: string
                          description: Key within the Secret data map. Defaults to "token".
                          default: token
                data_mappings:
                  type: array
                  description: |
                    Optional key remapping rules. When present, only the listed keys are
                    copied from the secret-engine response; all others are dropped.
                    When absent, all keys are copied verbatim.
                  items:
                    type: object
                    required:
                      - vault_key
                      - secret_key
                    properties:
                      vault_key:
                        type: string
                        description: Key name as returned by the secret-engine.
                      secret_key:
                        type: string
                        description: Key name to use in the resulting Kubernetes Secret.
            status:
              type: object
              description: Observed state written by the operator.
              properties:
                conditions:
                  type: array
                  description: Standard Kubernetes status conditions.
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                        description: Type of condition (e.g. "Synced").
                      status:
                        type: string
                        description: '"True", "False", or "Unknown".'
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                        description: Machine-readable reason code.
                      message:
                        type: string
                        description: Human-readable description of the condition.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: RFC 3339 timestamp of the last transition.
                      observedGeneration:
                        type: integer
                        format: int64
                        description: metadata.generation when the condition was set.
                last_sync_time:
                  type: string
                  format: date-time
                  description: RFC 3339 timestamp of the most recent successful sync.
                observed_generation:
                  type: integer
                  format: int64
                  description: The metadata.generation last reconciled by the operator.
                secret_version:
                  type: integer
                  format: int32
                  description: Version number of the secret returned by the secret-engine on last sync.
