# WSLVault Edge Gateway — OpenResty/NGINX Configuration
# Routes external traffic to the appropriate backend service.
# Handles token validation, rate limiting, and caching.
# For local development: plain HTTP on port 8080.

worker_processes auto;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

# Expose the shared gateway secret to Lua so it can be stamped onto every
# upstream request.
#
# This MUST be at main context. It was inside `http {}`, where nginx rejects it
# with "env directive is not allowed here" — so this configuration has never
# been able to start. It went unnoticed because the Helm chart never mounts it
# (the gateway container runs stock OpenResty) and the live regions set
# gateway.enabled=false.
env VAULT_GATEWAY_SECRET;

http {
    # Shared memory zones.
    #
    # token_cache is gone: `cache_token` in auth/token_auth.lua was defined and
    # never called, so the cache was always empty and the cache-hit path that
    # read from it was unreachable. 10 MB reserved for nothing.
    lua_shared_dict rate_limit 10m;
    lua_shared_dict secret_cache 50m;

    # Lua module paths
    lua_package_path "/etc/openresty/lua/?.lua;;";

    # Logging
    log_format json_combined escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_x_tenant_id":"$http_x_tenant_id",'
        '"http_x_request_id":"$http_x_request_id"'
    '}';

    access_log /dev/stdout json_combined;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Gzip
    gzip on;
    gzip_types application/json application/grpc;

    # Docker DNS resolver for upstream resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstream definitions
    upstream secret_engine {
        server secret-engine:8081;
        keepalive 64;
    }

    upstream crypto_service {
        server crypto-service:8080;
        keepalive 32;
    }

    upstream identity_service {
        server identity-service:8082;
        keepalive 32;
    }

    upstream policy_engine {
        server policy-engine:8083;
        keepalive 32;
    }

    upstream transit_engine {
        server transit-engine:8086;
        keepalive 32;
    }

    upstream lease_manager {
        server lease-manager:8084;
        keepalive 32;
    }

    upstream audit_service {
        server audit-service:8085;
        keepalive 32;
    }

    upstream mcp_server {
        server mcp-server:8087;
        keepalive 16;
    }

    upstream pki_engine {
        server pki-engine:8088;
        keepalive 32;
    }

    # Main API server — plain HTTP for local development
    server {
        listen 8080;
        server_name _;

        # Request ID propagation
        set $req_id $http_x_request_id;
        if ($req_id = '') {
            set $req_id $request_id;
        }
        proxy_set_header X-Request-ID $req_id;

        # Default proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Strip every client-supplied identity header, on EVERY location.
        #
        # nginx forwards request headers to the upstream by default, so a caller
        # could send `X-Tenant-Id: <victim>` and `X-Policies: root` alongside a
        # valid token and have the gateway pass both through — then stamp
        # X-Gateway-Auth on top, certifying the forged headers as
        # gateway-originated. Nothing here cleared them, so the comment above
        # claiming this prevented "forging X-Tenant-Id" was exactly wrong.
        #
        # An empty proxy_set_header value removes the header. This is at server
        # level rather than in the auth Lua on purpose: /v1/auth/ and the health
        # endpoints do not run that Lua, and a location added later would not
        # either.
        proxy_set_header X-Tenant-Id "";
        proxy_set_header X-Principal-Id "";
        proxy_set_header X-Policies "";
        proxy_set_header X-Vault-Tenant-ID "";
        proxy_set_header X-Vault-Principal-ID "";
        proxy_set_header X-Vault-Policies "";

        # Stamp the shared gateway secret onto every upstream request so
        # backends can distinguish gateway-originated traffic from direct hits.
        # Only meaningful now that the headers above are cleared: it attests
        # "this came through the gateway", which is worth nothing unless the
        # gateway actually controls what it forwards.
        set_by_lua_block $gateway_secret {
            return os.getenv("VAULT_GATEWAY_SECRET") or ""
        }
        proxy_set_header X-Gateway-Auth $gateway_secret;

        # ==========================================
        # Health endpoints (unauthenticated)
        # ==========================================
        location /health {
            access_log off;
            content_by_lua_block {
                ngx.say('{"status":"ok","service":"gateway"}')
            }
        }

        location /ready {
            access_log off;
            content_by_lua_file /etc/openresty/lua/health/readiness.lua;
        }

        # ==========================================
        # Authentication endpoints (no auth required)
        # ==========================================
        location /v1/auth/ {
            access_by_lua_file /etc/openresty/lua/middleware/rate_limit.lua;
            proxy_pass http://identity_service;
        }

        # ==========================================
        # Secret engine (auth required + quota enforcement)
        # ==========================================
        location /v1/secret/ {
            access_by_lua_block {
                dofile("/etc/openresty/lua/auth/token_auth.lua")
                dofile("/etc/openresty/lua/middleware/rate_limit.lua")
                dofile("/etc/openresty/lua/middleware/quota_check.lua")
            }
            proxy_pass http://secret_engine;
        }

        # ==========================================
        # Transit engine (auth required + quota enforcement)
        # ==========================================
        location /v1/transit/ {
            access_by_lua_block {
                dofile("/etc/openresty/lua/auth/token_auth.lua")
                dofile("/etc/openresty/lua/middleware/rate_limit.lua")
                dofile("/etc/openresty/lua/middleware/quota_check.lua")
            }
            proxy_pass http://transit_engine;
        }

        # ==========================================
        # Tenant management (auth required)
        # ==========================================
        location /v1/tenants {
            access_by_lua_file /etc/openresty/lua/auth/token_auth.lua;
            proxy_pass http://identity_service;
        }

        # ==========================================
        # API keys (auth required)
        # ==========================================
        location /v1/api-keys {
            access_by_lua_file /etc/openresty/lua/auth/token_auth.lua;
            proxy_pass http://identity_service;
        }

        # ==========================================
        # SCIM endpoints (auth required)
        # ==========================================
        location /scim/ {
            access_by_lua_file /etc/openresty/lua/auth/token_auth.lua;
            proxy_pass http://identity_service;
        }

        # ==========================================
        # Identity management (auth required)
        # ==========================================
        location /v1/identity/ {
            access_by_lua_file /etc/openresty/lua/auth/token_auth.lua;
            proxy_pass http://identity_service;
        }

        # ==========================================
        # Policy management (auth required)
        # ==========================================
        location /v1/policies/ {
            access_by_lua_file /etc/openresty/lua/auth/token_auth.lua;
            proxy_pass http://policy_engine;
        }

        # ==========================================
        # Lease management (auth required)
        # ==========================================
        location /v1/leases/ {
            access_by_lua_file /etc/openresty/lua/auth/token_auth.lua;
            proxy_pass http://lease_manager;
        }

        # ==========================================
        # Audit logs (auth required)
        # ==========================================
        location /v1/audit/ {
            access_by_lua_file /etc/openresty/lua/auth/token_auth.lua;
            proxy_pass http://audit_service;
        }

        # ==========================================
        # Tenant quota management (auth required)
        # Proxied to identity-service because quotas
        # are part of the tenant lifecycle.
        # ==========================================
        location /v1/quotas/ {
            access_by_lua_file /etc/openresty/lua/auth/token_auth.lua;
            proxy_pass http://identity_service;
        }

        # ==========================================
        # PKI engine (auth required + quota enforcement)
        # ==========================================
        location /v1/pki/ {
            access_by_lua_block {
                dofile("/etc/openresty/lua/auth/token_auth.lua")
                dofile("/etc/openresty/lua/middleware/rate_limit.lua")
                dofile("/etc/openresty/lua/middleware/quota_check.lua")
            }
            proxy_pass http://pki_engine;
        }

        # ==========================================
        # MCP endpoint (auth required)
        # ==========================================
        location /v1/mcp/ {
            access_by_lua_file /etc/openresty/lua/auth/token_auth.lua;
            proxy_pass http://mcp_server;
        }

        # ==========================================
        # Catch-all
        # ==========================================
        location / {
            return 404 '{"error":"not_found","message":"no route matched"}';
        }
    }
}
