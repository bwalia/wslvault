# WSLVault Edge Gateway — OpenResty/NGINX Configuration
# Routes external traffic to the appropriate backend service.
# Handles TLS termination, token validation, rate limiting, and caching.

worker_processes auto;
error_log /var/log/openresty/error.log warn;
pid /var/run/openresty/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # Shared memory zones
    lua_shared_dict token_cache 10m;
    lua_shared_dict rate_limit 10m;
    lua_shared_dict secret_cache 50m;

    # Lua module paths
    lua_package_path "/etc/openresty/lua/?.lua;;";

    # Logging
    log_format json_combined escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_x_tenant_id":"$http_x_tenant_id",'
        '"http_x_request_id":"$http_x_request_id"'
    '}';

    access_log /var/log/openresty/access.log json_combined;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Gzip
    gzip on;
    gzip_types application/json application/grpc;

    # Upstream definitions
    upstream secret_engine {
        server secret-engine:8081;
        keepalive 64;
    }

    upstream crypto_service {
        server crypto-service:8080;
        keepalive 32;
    }

    upstream identity_service {
        server identity-service:8082;
        keepalive 32;
    }

    upstream policy_engine {
        server policy-engine:8083;
        keepalive 32;
    }

    upstream transit_engine {
        server transit-engine:8086;
        keepalive 32;
    }

    upstream lease_manager {
        server lease-manager:8084;
        keepalive 32;
    }

    upstream audit_service {
        server audit-service:8085;
        keepalive 32;
    }

    upstream mcp_server {
        server mcp-server:8087;
        keepalive 16;
    }

    # Health check endpoint (unauthenticated)
    server {
        listen 8080;
        server_name _;

        location /health {
            access_log off;
            content_by_lua_block {
                ngx.say('{"status":"ok","service":"gateway"}')
            }
        }

        location /ready {
            access_log off;
            content_by_lua_file /etc/openresty/lua/health/readiness.lua;
        }
    }

    # Main API server
    server {
        listen 443 ssl http2;
        server_name _;

        # TLS configuration
        ssl_certificate /etc/ssl/certs/gateway.crt;
        ssl_certificate_key /etc/ssl/private/gateway.key;
        ssl_client_certificate /etc/ssl/certs/ca.crt;
        ssl_verify_client optional;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Request ID propagation
        set $request_id $http_x_request_id;
        if ($request_id = '') {
            set $request_id $request_id;
        }
        proxy_set_header X-Request-ID $request_id;

        # Default proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # ==========================================
        # Authentication endpoints (no auth required)
        # ==========================================
        location /v1/auth/ {
            access_by_lua_file /etc/openresty/lua/middleware/rate_limit.lua;
            proxy_pass http://identity_service;
        }

        # ==========================================
        # Secret engine (auth required)
        # ==========================================
        location /v1/secret/ {
            access_by_lua_file /etc/openresty/lua/auth/token_auth.lua;
            proxy_pass http://secret_engine;
        }

        # ==========================================
        # Transit engine (auth required)
        # ==========================================
        location /v1/transit/ {
            access_by_lua_file /etc/openresty/lua/auth/token_auth.lua;
            proxy_pass http://transit_engine;
        }

        # ==========================================
        # Identity management (auth required)
        # ==========================================
        location /v1/identity/ {
            access_by_lua_file /etc/openresty/lua/auth/token_auth.lua;
            proxy_pass http://identity_service;
        }

        # ==========================================
        # Policy management (auth required)
        # ==========================================
        location /v1/policies/ {
            access_by_lua_file /etc/openresty/lua/auth/token_auth.lua;
            proxy_pass http://policy_engine;
        }

        # ==========================================
        # Lease management (auth required)
        # ==========================================
        location /v1/leases/ {
            access_by_lua_file /etc/openresty/lua/auth/token_auth.lua;
            proxy_pass http://lease_manager;
        }

        # ==========================================
        # Audit logs (auth required)
        # ==========================================
        location /v1/audit/ {
            access_by_lua_file /etc/openresty/lua/auth/token_auth.lua;
            proxy_pass http://audit_service;
        }

        # ==========================================
        # MCP endpoint (auth required)
        # ==========================================
        location /v1/mcp/ {
            access_by_lua_file /etc/openresty/lua/auth/token_auth.lua;
            proxy_pass http://mcp_server;
        }

        # ==========================================
        # Catch-all
        # ==========================================
        location / {
            return 404 '{"error":"not_found","message":"no route matched"}';
        }
    }
}
