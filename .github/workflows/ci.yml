name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Serialize main: two quick merges must not race to the same release version
# (compute-version claims a number that auto-tag only pushes after the builds
# succeed, so run #2 has to wait for run #1's tag to exist). PRs only queue
# against themselves, and a newer push cancels their stale runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ─── work out the next release version (does NOT push the tag) ──────
  # Ported from jobshout's release pipeline. v<MAJOR>.<MINOR>.<PATCH>, PATCH
  # incrementing on every push to main. The repo's first tag is bare `1.0.0`
  # and the line continues v-prefixed (v1.0.1, ...), so the lookup accepts
  # both rather than forking a second tag line.
  compute-version:
    name: Compute Next Version
    runs-on: [self-hosted, wslvault]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read # resolves a number; tagging happens after the build
    outputs:
      next_version: ${{ steps.calc.outputs.next_version }}
      tag_is_new: ${{ steps.calc.outputs.tag_is_new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the tags

      - name: Calculate next version
        id: calc
        run: |
          set -euo pipefail
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' -l '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          [ -n "$LATEST_TAG" ] || LATEST_TAG="v1.0.0"
          BASE_VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          NEXT_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "Auto patch bump: $LATEST_TAG -> $NEXT_VERSION"

          # A collision means there is nothing to release (a replay, mostly);
          # the registry version tag and git tag are both skipped, while the
          # SHA-tagged image builds proceed as always.
          if git tag -l "$NEXT_VERSION" | grep -q "^$NEXT_VERSION$"; then
            echo "::warning::Tag $NEXT_VERSION already exists — skipping the release tags."
            echo "tag_is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag_is_new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: >
          cargo clippy --all-targets --all-features -- -D warnings
          -A clippy::needless_borrows_for_generic_args
          -A clippy::result_large_err
          -A clippy::too_many_arguments
          -A clippy::explicit_auto_deref
          -A clippy::doc_overindented_list_items
          -A clippy::needless_lifetimes
          -A dead_code

      - name: Check workspace compiles
        run: cargo check --workspace

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wslvault_test
          POSTGRES_USER: wslvault
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler postgresql-client

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      # DATABASE_URL is set so storage tests talk to this Postgres. Without the
      # schema they fail with `relation "shared.leases" does not exist` instead
      # of exercising the code — that is what red Test Suite after #45 was.
      - name: Apply schema
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: wslvault
          PGDATABASE: wslvault_test
          PGPASSWORD: testpassword
        run: |
          set -euo pipefail
          until pg_isready >/dev/null 2>&1; do sleep 1; done
          for f in storage/postgres/init/*.sql; do
            echo "applying $f"
            psql --no-psqlrc --set ON_ERROR_STOP=1 --quiet -f "$f"
          done

      - name: Run tests
        env:
          DATABASE_URL: postgres://wslvault:testpassword@localhost:5432/wslvault_test
        run: cargo test --workspace --all-features

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run audit
        run: cargo audit

  build-images:
    name: Build & Push Docker Images
    # Self-hosted (the wslvault-mac runner on hh193), because GitHub-hosted
    # minutes are exhausted. That runner is macOS/arm64 while k3s1 is amd64, so
    # it only ORCHESTRATES: the actual build runs on an in-cluster amd64
    # BuildKit pod (see the buildx kubernetes driver step below). platforms is
    # still pinned to linux/amd64 because the Dockerfiles choose their Rust musl
    # target from `uname -m`.
    runs-on: [self-hosted, wslvault]
    # Gated on check + test. These were decoupled (`needs: []`) back when lint
    # and audit were `continue-on-error`, so gating on them meant gating on
    # nothing. They block now — and with them decoupled, code that failed its
    # tests was still built and pushed to the registry on every merge to main.
    # compute-version feeds the release image tag; it only runs on main, same
    # as this job's own `if`.
    needs: [check, test, compute-version]
    env:
      # Kubeconfig for k3s1, used by the buildx kubernetes driver below so the
      # actual compile runs on an amd64 node instead of under emulation here.
      K3S_KUBECONFIG: /Users/balinderwalia/.kube/k3s1.yaml
    if: github.ref == 'refs/heads/main'
    strategy:
      # One failing service must not cancel the other twelve. With a single
      # self-hosted runner these jobs queue serially, so a fail-fast cancel
      # wipes out everything still waiting — that is exactly how a
      # replication-agent failure took the secret-engine image down with it.
      fail-fast: false
      matrix:
        service:
          - crypto-service
          - secret-engine
          - identity-service
          - policy-engine
          - transit-engine
          - lease-manager
          - audit-service
          - mcp-server
          - replication-agent
          - region-health
          - sync-scheduler
          - pki-engine
          - vault-ui
          - k8s-operator
    steps:
      - uses: actions/checkout@v4

      # Build on an amd64 BuildKit pod INSIDE k3s1 rather than emulating amd64
      # on this arm64 runner.
      #
      # History: these images used to build on ubuntu-latest (native amd64) in
      # ~8 minutes. Moving to this arm64 self-hosted runner with QEMU took the
      # secret-engine build from 8 minutes to SIX HOURS, where GitHub's job cap
      # cancelled it — and before that it failed outright, because
      # x86_64-linux-musl-gcc SIGSEGVs under QEMU while compiling ring's
      # curve25519.c. Emulation is not merely slow here, it is unreliable.
      #
      # The kubernetes driver runs the real build on a k3s1 node (amd64), so
      # compilation is native again while the runner just orchestrates.
      - name: Use in-cluster amd64 BuildKit (k3s1)
        env:
          KUBECONFIG: ${{ env.K3S_KUBECONFIG }}
        run: |
          set -euo pipefail

          # The runner reaches the k3s API over the LAN. A momentary route or
          # node flap (dial 6443: no route to host) used to fail ALL build jobs
          # at once, because the bootstrap had no retry. Two-part hardening:
          #   1. kubeconfig targets a control-plane node, not a worker (set on
          #      the runner host; see the k3s API line printed below).
          #   2. preflight-wait for the API, then bootstrap with retry, so a
          #      transient blip self-heals instead of failing the matrix.
          api=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
          echo "k3s API: $api"
          ready=
          for attempt in $(seq 1 30); do
            if curl -sk -o /dev/null --max-time 5 "$api/livez"; then ready=1; break; fi
            echo "k3s API unreachable (attempt $attempt/30); retrying in 5s"
            sleep 5
          done
          [ -n "$ready" ] || { echo "::error::k3s API $api not reachable after retries"; exit 1; }

          docker buildx inspect k3s-amd64 >/dev/null 2>&1 || \
            docker buildx create --name k3s-amd64 --driver kubernetes \
              --driver-opt namespace=default,replicas=1,requests.cpu=4,requests.memory=8Gi \
              --platform linux/amd64

          # Booting the in-cluster buildkit pod can still race a brief blip.
          booted=
          for attempt in $(seq 1 6); do
            if docker buildx inspect k3s-amd64 --bootstrap >/dev/null 2>&1; then booted=1; break; fi
            echo "buildkit bootstrap failed (attempt $attempt/6); retrying in 10s"
            sleep 10
          done
          [ -n "$booted" ] || { echo "::error::BuildKit bootstrap failed after retries"; exit 1; }
          docker buildx inspect k3s-amd64 | grep -E "^Status|^Platforms" || true

      # Requires repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        env:
          KUBECONFIG: ${{ env.K3S_KUBECONFIG }}
        with:
          builder: k3s-amd64
          context: .
          file: deploy/docker/${{ matrix.service }}/Dockerfile
          push: true
          # Pinned, not inferred. The Dockerfile selects its Rust musl target
          # from `uname -m`, so an unpinned build on the arm64 runner would
          # silently produce an aarch64 binary that the amd64 cluster cannot
          # execute — and the failure only surfaces at pod start.
          platforms: linux/amd64
          # The vX.Y.Z line lands only when the version is new; empty entries
          # are dropped by the action's list parser.
          tags: |
            bwalia/wslvault-${{ matrix.service }}:latest
            bwalia/wslvault-${{ matrix.service }}:0.1.0
            bwalia/wslvault-${{ matrix.service }}:${{ github.sha }}
            ${{ needs.compute-version.outputs.tag_is_new == 'true' && format('bwalia/wslvault-{0}:{1}', matrix.service, needs.compute-version.outputs.next_version) || '' }}
          # Only vault-ui declares these (footer build stamp); they are inert
          # for the other services.
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ needs.compute-version.outputs.next_version }}
          # GHA cache is unavailable on a self-hosted runner without the
          # Actions cache service; use the local buildx cache instead.
          cache-from: type=local,src=/tmp/.buildx-cache-${{ matrix.service }}
          cache-to: type=local,dest=/tmp/.buildx-cache-${{ matrix.service }},mode=max

  # ─── claim the version: push the tag + cut the release ──────────────
  # Runs only after EVERY image is in the registry: a failed build leaves no
  # tag and no release, and the next push retries the SAME version number.
  # Never push the tag first — a tag naming images that were never published
  # pins deploys to a version that cannot pull.
  auto-tag:
    name: Tag & Release
    needs: [compute-version, build-images]
    if: needs.compute-version.outputs.tag_is_new == 'true'
    runs-on: [self-hosted, wslvault]
    permissions:
      contents: write # the only job that writes to the repo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Tag exactly what was built, not HEAD of main (which may have
          # advanced while the builds ran).
          ref: ${{ github.sha }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        id: create_tag
        run: |
          set -euo pipefail
          NEXT_VERSION="${{ needs.compute-version.outputs.next_version }}"
          # compute-version checked collisions against its clone; re-check the
          # REMOTE, because the race being guarded is a tag appearing there
          # during the long builds.
          if git ls-remote --exit-code --tags origin "refs/tags/$NEXT_VERSION" >/dev/null 2>&1; then
            echo "::warning::Tag $NEXT_VERSION appeared during the build, skipping creation"
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
          else
            git tag -a "$NEXT_VERSION" -m "Release $NEXT_VERSION"
            git push origin "$NEXT_VERSION"
            echo "tag_created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.create_tag.outputs.tag_created == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.compute-version.outputs.next_version }}
          name: Release ${{ needs.compute-version.outputs.next_version }}
          generate_release_notes: true
