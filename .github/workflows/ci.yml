name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Serialize main: two quick merges must not race to the same release version
# (compute-version claims a number that auto-tag only pushes after the builds
# succeed, so run #2 has to wait for run #1's tag to exist). PRs only queue
# against themselves, and a newer push cancels their stale runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ─── work out the next release version (does NOT push the tag) ──────
  # Ported from jobshout's release pipeline. v<MAJOR>.<MINOR>.<PATCH>, PATCH
  # incrementing on every push to main. The repo's first tag is bare `1.0.0`
  # and the line continues v-prefixed (v1.0.1, ...), so the lookup accepts
  # both rather than forking a second tag line.
  compute-version:
    name: Compute Next Version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read # resolves a number; tagging happens after the build
    outputs:
      next_version: ${{ steps.calc.outputs.next_version }}
      tag_is_new: ${{ steps.calc.outputs.tag_is_new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the tags

      - name: Calculate next version
        id: calc
        run: |
          set -euo pipefail
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' -l '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          [ -n "$LATEST_TAG" ] || LATEST_TAG="v1.0.0"
          BASE_VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          NEXT_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "Auto patch bump: $LATEST_TAG -> $NEXT_VERSION"

          # A collision means there is nothing to release (a replay, mostly);
          # the registry version tag and git tag are both skipped, while the
          # SHA-tagged image builds proceed as always.
          if git tag -l "$NEXT_VERSION" | grep -q "^$NEXT_VERSION$"; then
            echo "::warning::Tag $NEXT_VERSION already exists — skipping the release tags."
            echo "tag_is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag_is_new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: >
          cargo clippy --all-targets --all-features -- -D warnings
          -A clippy::needless_borrows_for_generic_args
          -A clippy::result_large_err
          -A clippy::too_many_arguments
          -A clippy::explicit_auto_deref
          -A clippy::doc_overindented_list_items
          -A clippy::needless_lifetimes
          -A dead_code

      - name: Check workspace compiles
        run: cargo check --workspace

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wslvault_test
          POSTGRES_USER: wslvault
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler postgresql-client

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      # DATABASE_URL is set so storage tests talk to this Postgres. Without the
      # schema they fail with `relation "shared.leases" does not exist` instead
      # of exercising the code — that is what red Test Suite after #45 was.
      - name: Apply schema
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: wslvault
          PGDATABASE: wslvault_test
          PGPASSWORD: testpassword
        run: |
          set -euo pipefail
          until pg_isready >/dev/null 2>&1; do sleep 1; done
          for f in storage/postgres/init/*.sql; do
            echo "applying $f"
            psql --no-psqlrc --set ON_ERROR_STOP=1 --quiet -f "$f"
          done

      - name: Run tests
        env:
          DATABASE_URL: postgres://wslvault:testpassword@localhost:5432/wslvault_test
        run: cargo test --workspace --all-features

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run audit
        run: cargo audit

  build-images:
    name: Build & Push Docker Images
    # GitHub-hosted, native amd64. The repo is public, so hosted-runner minutes
    # are free and unlimited — no reason for the old self-hosted-Mac + in-cluster
    # BuildKit contraption, which depended on the runner's flaky LAN path to the
    # k3s API/kubelet proxy and failed the whole matrix at once. ubuntu-latest is
    # x86_64, so the Dockerfiles' `uname -m` musl target is amd64 with no
    # emulation.
    #
    # Images are built and pushed to GHCR, then mirrored to Docker Hub. GHCR is
    # primary because it authenticates with the built-in GITHUB_TOKEN against a
    # service in the same datacentre — a Docker Hub auth flake used to fail the
    # whole release, and it is no longer on the build's critical path.
    runs-on: ubuntu-latest
    # Gated on check + test. These were decoupled (`needs: []`) back when lint
    # and audit were `continue-on-error`, so gating on them meant gating on
    # nothing. They block now — and with them decoupled, code that failed its
    # tests was still built and pushed to the registry on every merge to main.
    # compute-version feeds the release image tag; it only runs on main, same
    # as this job's own `if`.
    needs: [check, test, compute-version]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write # GHCR is the primary registry for these images
    strategy:
      # One failing service must not cancel the others; hosted runners build
      # these in parallel.
      fail-fast: false
      matrix:
        service:
          - crypto-service
          - secret-engine
          - identity-service
          - policy-engine
          - transit-engine
          - lease-manager
          - audit-service
          - mcp-server
          - replication-agent
          - region-health
          - sync-scheduler
          - pki-engine
          - vault-ui
          - k8s-operator
    steps:
      - uses: actions/checkout@v4

      # Native amd64 build on the hosted runner — no cluster, no LAN, no IPs.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR is the PRIMARY registry, and the build pushes straight to it.
      #
      # It used to be Docker Hub, and a release died on
      #   failed to fetch oauth token: Post "https://auth.docker.io/token":
      #   unexpected EOF
      # — one service out of thirteen, same credentials as the twelve that
      # succeeded, so purely Docker Hub's auth endpoint dropping a connection.
      # GHCR authenticates with the built-in GITHUB_TOKEN against a service in
      # the same datacentre as the runner: no stored PAT to expire, no
      # third-party auth host on the critical path, and no pull-rate limits.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }} to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.service }}/Dockerfile
          push: true
          # Native on the amd64 hosted runner (no emulation). Pinned so the
          # Dockerfile's `uname -m` musl target is always amd64.
          platforms: linux/amd64
          # The vX.Y.Z line lands only when the version is new; empty entries
          # are dropped by the action's list parser.
          tags: |
            ghcr.io/bwalia/wslvault-${{ matrix.service }}:latest
            ghcr.io/bwalia/wslvault-${{ matrix.service }}:0.1.0
            ghcr.io/bwalia/wslvault-${{ matrix.service }}:${{ github.sha }}
            ${{ needs.compute-version.outputs.tag_is_new == 'true' && format('ghcr.io/bwalia/wslvault-{0}:{1}', matrix.service, needs.compute-version.outputs.next_version) || '' }}
          # Only vault-ui declares these (footer build stamp); they are inert
          # for the other services.
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ needs.compute-version.outputs.next_version }}
          # GitHub Actions cache, scoped per service.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Docker Hub is now the MIRROR. It stays a required step rather than
      # best-effort, because the deployed regions still pull `bwalia/…` by
      # default and a release that never reached the registry the cluster reads
      # is not a release — it would fail silently at sync time instead of
      # loudly here.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror ${{ matrix.service }} to Docker Hub
        run: |
          set -euo pipefail
          src="ghcr.io/bwalia/wslvault-${{ matrix.service }}:${{ github.sha }}"
          img="bwalia/wslvault-${{ matrix.service }}"
          args=(--tag "$img:latest" --tag "$img:0.1.0" --tag "$img:${{ github.sha }}")
          if [ "${{ needs.compute-version.outputs.tag_is_new }}" = "true" ]; then
            args+=(--tag "$img:${{ needs.compute-version.outputs.next_version }}")
          fi

          # Retried, because this is the leg that actually failed: the fault was
          # a dropped connection to auth.docker.io, which a second attempt
          # moments later does not reproduce. imagetools only copies a manifest
          # and blobs, so a retry costs seconds and never rebuilds.
          for attempt in 1 2 3; do
            if docker buildx imagetools create "${args[@]}" "$src"; then
              echo "mirrored to Docker Hub on attempt $attempt"
              exit 0
            fi
            echo "::warning::Docker Hub mirror attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::Docker Hub mirror failed after 3 attempts"
          exit 1

  # ─── claim the version: push the tag + cut the release ──────────────
  # Runs only after EVERY image is in the registry: a failed build leaves no
  # tag and no release, and the next push retries the SAME version number.
  # Never push the tag first — a tag naming images that were never published
  # pins deploys to a version that cannot pull.
  auto-tag:
    name: Tag & Release
    needs: [compute-version, build-images]
    if: needs.compute-version.outputs.tag_is_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the only job that writes to the repo
    steps:
      # Create the tag via the GitHub API, NOT `git push`. A GITHUB_TOKEN push
      # of a ref whose commit contains workflow files is rejected ("refusing to
      # allow a GitHub App to create or update workflow ... without workflows
      # permission"), and that token cannot be granted the workflows permission.
      # The API creates the tag ref to an existing commit, which is not a
      # workflow modification, so contents:write is enough.
      - name: Create tag
        id: create_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEXT_VERSION="${{ needs.compute-version.outputs.next_version }}"
          # compute-version checked collisions against its clone; re-check the
          # remote, because the race being guarded is a tag appearing during the
          # build.
          if gh api "repos/${{ github.repository }}/git/ref/tags/$NEXT_VERSION" >/dev/null 2>&1; then
            echo "::warning::Tag $NEXT_VERSION appeared during the build, skipping creation"
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
          else
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$NEXT_VERSION" -f sha="${{ github.sha }}" >/dev/null
            echo "tag_created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.create_tag.outputs.tag_created == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.compute-version.outputs.next_version }}
          name: Release ${{ needs.compute-version.outputs.next_version }}
          generate_release_notes: true
