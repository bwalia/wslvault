name: Deploy marketing site to GitHub Pages

# Builds the Next.js static export in www/ and publishes it to GitHub Pages,
# served at the custom domain in www/CNAME (www.wslvault.org, with the apex
# wslvault.org redirecting to it). Mirrors the vantiq site's deploy.
#
# Only paths under www/ trigger it, so the Rust/services CI is untouched.

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# GitHub Pages needs these; the default GITHUB_TOKEN permissions are not enough.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. In-progress runs finish rather than being cancelled, so
# a half-uploaded artifact never becomes the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The custom domain serves from the root; a project page serves from
      # /<repo>. The domain is read from www/CNAME so the repo is the source of
      # truth and no one has to keep a variable in sync with it.
      - name: Resolve base path from CNAME
        run: |
          if [ -s CNAME ]; then
            domain=$(tr -d '[:space:]' < CNAME)
            echo "Custom domain: $domain (serving from root)"
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "Project page (serving from /${{ github.event.repository.name }})"
            echo "NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi

      - name: Build static export
        env:
          NEXT_STATIC_EXPORT: "true"
        run: npm run build

      # Without this, Pages runs the upload through Jekyll, which drops _next/.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      # An Actions deploy replaces the whole site, so the CNAME must be part of
      # the artifact or the custom-domain setting is dropped on publish.
      - name: Carry CNAME into the artifact
        run: cp CNAME out/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: www/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
