name: Deploy marketing site to GitHub Pages

# Builds the Next.js static export in www/ and publishes it to GitHub Pages
# (www.wslvault.org). Ring Promoter's github deployer dispatches this workflow
# with ENV / DEPLOY_BRANCH / DEPLOY_MODE — see deploy/ring-promoter/wslvault-www.yaml.
#
# Push to www/** on main still deploys directly as a safety net; the normal
# promote path is: push → seed RP (seed-www-ring-promoter.yml) → RP dispatches
# this workflow.

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      ENV:
        description: "Ring target_env from Ring Promoter (informational for a single live site)"
        required: true
        default: "www"
        type: string
      DEPLOY_BRANCH:
        description: "Git ref (branch, tag, or SHA) to build and publish"
        required: true
        default: "main"
        type: string
      DEPLOY_MODE:
        description: "Deploy mode (accepted for Ring Promoter compatibility)"
        required: false
        default: "full"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v5
        with:
          # RP seeds a version string as DEPLOY_BRANCH; push events use the
          # triggering commit. Either way the static export embeds that ref in
          # version.json so RP health_version_field checks can verify the live site.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.DEPLOY_BRANCH || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve base path from CNAME
        run: |
          if [ -s CNAME ]; then
            domain=$(tr -d '[:space:]' < CNAME)
            echo "Custom domain: $domain (serving from root)"
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "Project page (serving from /${{ github.event.repository.name }})"
            echo "NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi

      - name: Stamp version.json for Ring Promoter health checks
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.DEPLOY_BRANCH || github.sha }}
          ENV_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.ENV || 'www' }}
        run: |
          set -euo pipefail
          mkdir -p public
          # Exact string RP seeded / promoted — health_version_field: version
          # compares against this. Prefer the ref name over the resolved SHA so
          # seeding "main" or "v1.0.14" matches what the UI reports.
          printf '{"version":"%s","env":"%s","sha":"%s","built_at":"%s"}\n' \
            "$VERSION" "$ENV_NAME" "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > public/version.json
          cat public/version.json

      - name: Build static export
        env:
          NEXT_STATIC_EXPORT: "true"
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Carry CNAME into the artifact
        run: cp CNAME out/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: www/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
