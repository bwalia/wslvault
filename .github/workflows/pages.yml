name: Deploy marketing site to GitHub Pages

# Builds the Next.js static export in www/ and publishes it to GitHub Pages
# (www.wslvault.org). Every push/merge to main redeploys the live site so the
# landing page stays current. Ring Promoter can also workflow_dispatch this
# workflow — see deploy/ring-promoter/wslvault-www.yaml.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ENV:
        description: "Ring target_env from Ring Promoter (informational for a single live site)"
        required: true
        default: "www"
        type: string
      DEPLOY_BRANCH:
        description: "Git ref (branch, tag, or SHA) to build and publish"
        required: true
        default: "main"
        type: string
      DEPLOY_MODE:
        description: "Deploy mode (accepted for Ring Promoter compatibility)"
        required: false
        default: "full"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags so the footer can show a real version tag when
          # HEAD is tagged (or git describe otherwise).
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.DEPLOY_BRANCH || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve base path from CNAME
        run: |
          if [ -s CNAME ]; then
            domain=$(tr -d '[:space:]' < CNAME)
            echo "Custom domain: $domain (serving from root)"
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "Project page (serving from /${{ github.event.repository.name }})"
            echo "NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi

      - name: Stamp version.json and footer version
        env:
          # RP health_version_field compares against this exact string when
          # seeding via Ring Promoter. On plain main pushes use the commit SHA.
          RP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.DEPLOY_BRANCH || github.sha }}
          ENV_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.ENV || 'www' }}
        run: |
          set -euo pipefail
          mkdir -p public
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          # Prefer an exact tag on this commit (release), else git describe,
          # else the short SHA — this is what the footer shows.
          if LABEL=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            :
          elif LABEL=$(git describe --tags --always HEAD 2>/dev/null); then
            :
          else
            LABEL="$SHORT_SHA"
          fi
          # workflow_dispatch with an explicit tag/branch name should win for
          # the visible label when it is not a raw 40-char SHA.
          case "${RP_VERSION}" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*)
              ;;
            *)
              if [ -n "${RP_VERSION}" ]; then
                LABEL="${RP_VERSION}"
              fi
              ;;
          esac
          printf '{"version":"%s","label":"%s","env":"%s","sha":"%s","built_at":"%s"}\n' \
            "$RP_VERSION" "$LABEL" "$ENV_NAME" "$FULL_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > public/version.json
          cat public/version.json
          echo "NEXT_PUBLIC_SITE_VERSION=${LABEL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Build static export
        env:
          NEXT_STATIC_EXPORT: "true"
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Carry CNAME into the artifact
        run: cp CNAME out/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: www/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
