[workspace]
resolver = "2"
members = [
    "crates/wslvault-core",
    "crates/wslvault-storage",
    "crates/wslvault-connectors",
    "crates/wslvault-cluster",
    "services/secret-engine",
    "services/crypto-service",
    "services/identity-service",
    "services/policy-engine",
    "services/transit-engine",
    "services/pki-engine",
    "services/lease-manager",
    "services/audit-service",
    "services/mcp-server",
    "services/k8s-operator",
    "services/replication-agent",
    "services/region-health",
    "services/sync-scheduler",
    "sdks/rust",
    "wslvault-cli",
]

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tonic = { version = "0.12", features = ["tls", "transport"] }
prost = "0.13"
tonic-build = "0.12"
axum = { version = "0.7", features = ["macros", "ws"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "auth", "cors"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ring = "0.17"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
sha2 = "0.10"
# Shamir Secret Sharing over GF(256), for the seal. Splitting the unseal key is
# the one place hand-rolling would be indefensible.
sharks = "0.5"
# Constant-time byte comparison. ring's verify_slices_are_equal is deprecated
# ("internal function not intended for external use"); subtle is its replacement.
subtle = "2.6"
hkdf = "0.12"
argon2 = "0.5"
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa"] }
jsonwebtoken = "9.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
opentelemetry = { version = "0.26", features = ["trace"] }
opentelemetry-otlp = "0.26"
config = "0.14"
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.10", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait = "0.1"
zeroize = { version = "1.8", features = ["derive"] }
# default-features = false drops the deprecated protobuf exposition format
# (and with it protobuf 2.x, RUSTSEC-2024-0437). We only ever emit text format
# via TextEncoder, so nothing is lost.
prometheus = { version = "0.14", default-features = false, features = ["process"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
bytes = "1.7"
futures = "0.3"
pin-project-lite = "0.2"
clap = { version = "4.5", features = ["derive", "env", "string"] }
clap_complete = "4.5"
toml = "0.8"
dirs = "6"
colored = "2"
dialoguer = "0.11"
once_cell = "1.19"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
criterion = { version = "0.5", features = ["html_reports"] }
