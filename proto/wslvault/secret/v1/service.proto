syntax = "proto3";
package wslvault.secret.v1;

service SecretService {
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc DestroySecret(DestroySecretRequest) returns (DestroySecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc GetMetadata(GetMetadataRequest) returns (GetMetadataResponse);
}

message GetSecretRequest {
  string tenant_id = 1;
  string path = 2;
  optional uint32 version = 3;
}

message GetSecretResponse {
  bytes data = 1;
  uint32 version = 2;
  string created_at = 3;
  map<string, string> metadata = 4;
}

message PutSecretRequest {
  string tenant_id = 1;
  string path = 2;
  bytes data = 3;
  optional uint32 cas = 4;
  map<string, string> metadata = 5;
}

message PutSecretResponse {
  string secret_id = 1;
  uint32 version = 2;
}

message DeleteSecretRequest {
  string tenant_id = 1;
  string path = 2;
  repeated uint32 versions = 3;
}

message DeleteSecretResponse {
  uint32 deleted_count = 1;
}

message DestroySecretRequest {
  string tenant_id = 1;
  string path = 2;
  repeated uint32 versions = 3;
}

message DestroySecretResponse {
  uint32 destroyed_count = 1;
}

message ListSecretsRequest {
  string tenant_id = 1;
  string prefix = 2;
}

message ListSecretsResponse {
  repeated string paths = 1;
}

message GetMetadataRequest {
  string tenant_id = 1;
  string path = 2;
}

message GetMetadataResponse {
  string secret_id = 1;
  string path = 2;
  string engine = 3;
  uint32 current_version = 4;
  uint32 max_versions = 5;
  bool cas_required = 6;
  string created_at = 7;
  string updated_at = 8;
}
