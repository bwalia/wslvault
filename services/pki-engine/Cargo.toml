[package]
name = "pki-engine"
version = "0.1.0"
edition = "2021"
description = "Internal certificate authority (PKI) engine for the WSLVault platform"
license = "Apache-2.0"

[[bin]]
name = "pki-engine"
path = "src/main.rs"

[dependencies]
wslvault-core = { path = "../../crates/wslvault-core" }
wslvault-storage = { path = "../../crates/wslvault-storage" }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
aes-gcm = { workspace = true }
ring = { workspace = true }
zeroize = { workspace = true }
config = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

# Certificate generation and CSR handling.
# pem: enables from_ca_cert_pem / CertificateSigningRequestParams::from_pem.
# x509-parser: enables parsing of existing CA certificates (from_ca_cert_pem).
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
# time::OffsetDateTime is the type rcgen uses for certificate validity windows
time = { version = "0.3", features = ["formatting"] }
# CSR / cert parsing and CRL generation
x509-parser = { version = "0.16", features = ["verify"] }
# PEM encoding/decoding (used by rcgen and x509-parser)
pem = "3"
# RSA key support
rsa = { workspace = true }
# ECDSA P-256 support (for ECDSA CA/leaf keys)
p256 = { workspace = true }
