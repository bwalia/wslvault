[package]
name = "crypto-service"
version = "0.1.0"
edition = "2021"
description = "Cryptographic operations and key management service"
license = "Apache-2.0"

[[bin]]
name = "crypto-service"
path = "src/main.rs"

[features]
default = []
# AWS KMS root key provider: decrypts the root KEK via AWS KMS at startup.
# Pulls in the official AWS SDK for KMS and the SDK config loader.
# Select at runtime via VAULT_ROOT_KEY_PROVIDER=aws-kms.
aws-kms = ["aws-sdk-kms", "aws-config"]

[dependencies]
wslvault-core = { path = "../../crates/wslvault-core" }
wslvault-storage = { path = "../../crates/wslvault-storage" }
wslvault-cluster = { path = "../../crates/wslvault-cluster" }
tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
aes-gcm = { workspace = true }
ring = { workspace = true }
sha2 = { workspace = true }
hkdf = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
config = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
prometheus = { workspace = true }

# AWS KMS root key provider (optional — only compiled when `aws-kms` feature is active).
# Version matches the aws-sdk-secretsmanager version already in the workspace lock file.
aws-sdk-kms = { version = "1", optional = true }
aws-config = { version = "1", optional = true }

[build-dependencies]
tonic-build = { workspace = true }
