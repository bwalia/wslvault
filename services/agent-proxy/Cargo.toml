[package]
name = "agent-proxy"
version = "0.1.0"
edition = "2021"
description = "Credential-brokering egress proxy for AI agents: agents hold a session token, never the upstream credential"
license = "Apache-2.0"

[[bin]]
name = "agent-proxy"
path = "src/main.rs"

[dependencies]
wslvault-core = { path = "../../crates/wslvault-core" }
tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
# `stream` lets request and response bodies flow through without buffering,
# which SSE (streamed model output) and large uploads both need.
reqwest = { workspace = true, features = ["stream"] }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
jsonwebtoken = { workspace = true }
